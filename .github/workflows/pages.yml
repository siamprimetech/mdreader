name: Pages

# The site in site/ is published to GitHub Pages on every push to main.
# The Pages source has to be set to "GitHub Actions" in the repository
# settings for this workflow to be allowed to deploy it.
on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish the site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up the site
        uses: actions/configure-pages@v6

      - name: Collect the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
